[package]
name = "abyss"
version = "0.1.0"
edition = "2021"
description = "Abyss — cliente desktop nativo e leve (sem Chromium) para o Google Gemini, com modo Chat e modo Agente Local."
build = "build.rs"

[[bin]]
name = "abyss"
path = "src/main.rs"

[dependencies]
# GUI nativa em modo imediato (OpenGL via glow). Sem WebView, sem Chromium.
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts"] }
# HTTP bloqueante e leve. TLS via SChannel do Windows (native-tls), sem crypto em C.
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
serde_json = "1"
# Decodifica o PNG do ícone da janela (só o decoder de PNG, para ficar leve).
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
# Embute o ícone no .exe (usa windres/ar do MinGW).
winresource = "0.1"

[profile.release]
opt-level = 2
